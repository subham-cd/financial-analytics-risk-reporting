<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FinSight – Financial Intelligence & Risk Analytics Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            slate: {
              850: '#0f172a',
              900: '#0b1120',
              950: '#020617',
            },
            brand: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              500: '#0ea5e9',
              600: '#0284c7',
              700: '#0369a1',
            }
          }
        }
      }
    }
  </script>
  <style>
    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.2); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(148, 163, 184, 0.4); }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col antialiased selection:bg-brand-500 selection:text-white transition-colors duration-200">

  <!-- TOP HEADER -->
  <header class="h-16 border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50 px-6 flex items-center justify-between">
    <div class="flex items-center space-x-4">
      <div class="flex items-center space-x-2">
        <div class="w-9 h-9 rounded-lg bg-gradient-to-tr from-brand-600 to-indigo-600 flex items-center justify-center font-bold text-white shadow-lg shadow-brand-500/20">
          FS
        </div>
        <div>
          <span class="text-lg font-bold tracking-tight text-white flex items-center gap-2">
            FinSight
            <span class="text-[10px] font-semibold bg-brand-500/10 text-brand-400 border border-brand-500/20 px-2 py-0.5 rounded-full uppercase tracking-wider">Enterprise 2.0</span>
          </span>
          <span class="text-xs text-slate-400 block -mt-1">Financial Intelligence & Credit Risk Platform</span>
        </div>
      </div>
      <div class="hidden md:flex items-center space-x-2 pl-4 border-l border-slate-800 text-xs text-slate-400">
        <span class="inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        <span>Nexvia Evaluation Build</span>
        <span class="text-slate-600">•</span>
        <span class="text-emerald-400 font-mono font-medium">Reconciled ($0.00 Diff)</span>
      </div>
    </div>

    <!-- Right Controls -->
    <div class="flex items-center space-x-3">
      <!-- Dark/Light Mode Toggle -->
      <button onclick="toggleTheme()" class="p-2 rounded-lg bg-slate-800/80 hover:bg-slate-700 text-slate-300 hover:text-white transition border border-slate-700 text-xs flex items-center gap-1.5" title="Toggle Theme">
        <span id="themeIcon">☀️</span>
        <span class="hidden sm:inline text-xs font-medium" id="themeText">Light</span>
      </button>

      <!-- Quick PDF Download -->
      <button onclick="navigateTo('reports')" class="px-3.5 py-1.5 rounded-lg bg-brand-600 hover:bg-brand-500 text-white font-medium text-xs shadow-md shadow-brand-600/20 flex items-center gap-1.5 transition">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
        <span>Board Report PDF</span>
      </button>

      <!-- API Docs Link -->
      <a href="/docs" target="_blank" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium text-xs border border-slate-700 transition">
        FastAPI Docs
      </a>
    </div>
  </header>

  <!-- MAIN WORKSPACE -->
  <div class="flex flex-1 overflow-hidden">
    <!-- LEFT SIDEBAR -->
    <aside class="w-64 border-r border-slate-800 bg-slate-900/50 flex flex-col justify-between p-4 flex-shrink-0">
      <nav class="space-y-1" id="navContainer">
        <button onclick="navigateTo('overview')" id="nav-overview" class="nav-item w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm font-medium transition text-brand-400 bg-brand-500/10 border border-brand-500/20">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
          <span>Executive Overview</span>
        </button>

        <button onclick="navigateTo('financial')" id="nav-financial" class="nav-item w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm font-medium transition text-slate-400 hover:text-white hover:bg-slate-800">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
          <span>Financial Statements</span>
        </button>

        <button onclick="navigateTo('budget')" id="nav-budget" class="nav-item w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm font-medium transition text-slate-400 hover:text-white hover:bg-slate-800">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 3.055A9.001 9.001 0 1020.945 13H11V3.055z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.488 9H15V3.512A9.025 9.025 0 0120.488 9z"/></svg>
          <span>Budget vs Actual</span>
        </button>

        <button onclick="navigateTo('credit')" id="nav-credit" class="nav-item w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm font-medium transition text-slate-400 hover:text-white hover:bg-slate-800">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
          <span>Credit Risk Intelligence</span>
        </button>

        <button onclick="navigateTo('scorecard')" id="nav-scorecard" class="nav-item w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm font-medium transition text-slate-400 hover:text-white hover:bg-slate-800">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
          <span>Borrower Scorecard</span>
        </button>

        <button onclick="navigateTo('reports')" id="nav-reports" class="nav-item w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm font-medium transition text-slate-400 hover:text-white hover:bg-slate-800">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
          <span>Board Reports</span>
        </button>

        <button onclick="navigateTo('data')" id="nav-data" class="nav-item w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm font-medium transition text-slate-400 hover:text-white hover:bg-slate-800">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4"/></svg>
          <span>Data Architecture</span>
        </button>
      </nav>

      <!-- System Status Footer -->
      <div class="p-3 rounded-lg bg-slate-900 border border-slate-800 text-xs">
        <div class="flex items-center justify-between text-slate-400 mb-1">
          <span>Engine Status</span>
          <span class="text-emerald-400 font-semibold">Active</span>
        </div>
        <div class="text-[11px] text-slate-500">
          SQLite Core: <span class="font-mono text-slate-400">finsight.db</span><br>
          ML Model: <span class="font-mono text-slate-400">Logistic+WOE v1</span>
        </div>
      </div>
    </aside>

    <!-- CONTENT DISPLAY AREA -->
    <main class="flex-1 overflow-y-auto p-8" id="contentArea">
      <!-- Dynamic views load here -->
    </main>
  </div>

  <!-- APPLICATION JAVASCRIPT LOGIC -->
  <script>
    // State
    let currentTab = 'overview';
    let overviewData = null;
    let chartInstance = null;
    let bvaChartInstance = null;

    // Theme Management
    function toggleTheme() {
      const html = document.documentElement;
      const isDark = html.classList.toggle('dark');
      document.getElementById('themeIcon').innerText = isDark ? '☀️' : '🌙';
      document.getElementById('themeText').innerText = isDark ? 'Light' : 'Dark';
    }

    // Navigation Switcher
    function navigateTo(tabId) {
      currentTab = tabId;
      document.querySelectorAll('.nav-item').forEach(el => {
        el.className = "nav-item w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm font-medium transition text-slate-400 hover:text-white hover:bg-slate-800";
      });
      const activeNav = document.getElementById(`nav-${tabId}`);
      if (activeNav) {
        activeNav.className = "nav-item w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm font-medium transition text-brand-400 bg-brand-500/10 border border-brand-500/20";
      }

      const content = document.getElementById('contentArea');
      content.innerHTML = `<div class="flex items-center justify-center h-64 text-slate-500"><svg class="animate-spin h-6 w-6 text-brand-500 mr-3" viewBox="0 0 24 24" fill="none"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path></svg> Fetching live financial intelligence...</div>`;

      if (tabId === 'overview') loadOverview();
      else if (tabId === 'financial') loadFinancialStatements();
      else if (tabId === 'budget') loadBudgetAnalysis();
      else if (tabId === 'credit') loadCreditRisk();
      else if (tabId === 'scorecard') loadScorecard();
      else if (tabId === 'reports') loadReports();
      else if (tabId === 'data') loadDataArchitecture();
    }

    // Currency Formatter
    const fmtUSD = (v) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 }).format(v || 0);
    const fmtPct = (v) => `${(v || 0).toFixed(1)}%`;

    // ------------------------------------------------------------------------
    // VIEW 1: EXECUTIVE OVERVIEW
    // ------------------------------------------------------------------------
    async function loadOverview() {
      try {
        const res = await fetch('/api/dashboard/overview');
        const data = await res.json();
        overviewData = data;
        const kpis = data.financial_kpis;
        const cp = data.credit_portfolio;
        const bva = data.budget_variance;

        const html = `
          <div class="space-y-6">
            <!-- Header Section -->
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
              <div>
                <h1 class="text-2xl font-bold tracking-tight text-white">Executive Financial Intelligence</h1>
                <p class="text-xs text-slate-400">Enterprise P&L performance, budget execution, and credit portfolio health | FY 2026</p>
              </div>
              <div class="flex items-center gap-3">
                <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                  <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
                  Balance Sheet Reconciled
                </span>
                <span class="text-xs font-mono text-slate-500">Period: 2026-M01 to M12</span>
              </div>
            </div>

            <!-- Top KPI Cards Grid -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
              <div class="p-5 rounded-xl bg-slate-900 border border-slate-800 shadow-sm relative overflow-hidden">
                <div class="text-xs font-semibold uppercase tracking-wider text-slate-400">Total Revenue (FY26)</div>
                <div class="text-2xl font-bold text-white mt-1 font-mono">${fmtUSD(kpis.total_revenue)}</div>
                <div class="mt-2 text-xs text-slate-400 flex items-center justify-between">
                  <span>Gross Margin: <strong class="text-brand-400">${fmtPct(kpis.gross_margin_pct)}</strong></span>
                  <span class="text-emerald-400 font-medium">COGS: ${fmtUSD(kpis.total_cogs)}</span>
                </div>
              </div>

              <div class="p-5 rounded-xl bg-slate-900 border border-slate-800 shadow-sm relative overflow-hidden">
                <div class="text-xs font-semibold uppercase tracking-wider text-slate-400">Operating EBITDA</div>
                <div class="text-2xl font-bold text-white mt-1 font-mono">${fmtUSD(kpis.ebitda)}</div>
                <div class="mt-2 text-xs text-slate-400 flex items-center justify-between">
                  <span>EBITDA Margin: <strong class="text-emerald-400">${fmtPct(kpis.ebitda_margin_pct)}</strong></span>
                  <span class="text-slate-400">Opex: ${fmtUSD(kpis.operating_expenses)}</span>
                </div>
              </div>

              <div class="p-5 rounded-xl bg-slate-900 border border-slate-800 shadow-sm relative overflow-hidden">
                <div class="text-xs font-semibold uppercase tracking-wider text-slate-400">Net Profit (After Tax)</div>
                <div class="text-2xl font-bold text-emerald-400 mt-1 font-mono">${fmtUSD(kpis.net_profit)}</div>
                <div class="mt-2 text-xs text-slate-400 flex items-center justify-between">
                  <span>Net Margin: <strong class="text-emerald-400">${fmtPct(kpis.net_profit_margin_pct)}</strong></span>
                  <span class="text-slate-400">Tax Rate: 21%</span>
                </div>
              </div>

              <div class="p-5 rounded-xl bg-slate-900 border border-slate-800 shadow-sm relative overflow-hidden">
                <div class="text-xs font-semibold uppercase tracking-wider text-slate-400">Credit Risk Portfolio</div>
                <div class="text-2xl font-bold text-white mt-1 font-mono">${cp.total_loans.toLocaleString()} <span class="text-sm font-normal text-slate-400">Loans</span></div>
                <div class="mt-2 text-xs text-slate-400 flex items-center justify-between">
                  <span>Default Rate: <strong class="text-amber-400">${fmtPct(cp.default_rate_pct)}</strong></span>
                  <span>Avg Score: <strong class="text-brand-400">${cp.avg_credit_score}</strong></span>
                </div>
              </div>
            </div>

            <!-- Charts Row -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
              <!-- Revenue vs Expenses Trend -->
              <div class="lg:col-span-2 p-6 rounded-xl bg-slate-900 border border-slate-800 shadow-sm">
                <div class="flex items-center justify-between mb-4">
                  <div>
                    <h3 class="text-sm font-semibold text-white">Monthly Financial Trajectory (FY 2026)</h3>
                    <p class="text-xs text-slate-400">Revenue, Operating Expenses, and Net Profit Margin Trends</p>
                  </div>
                  <div class="flex items-center gap-4 text-xs">
                    <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-sm bg-brand-500 inline-block"></span> Revenue</span>
                    <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-sm bg-slate-600 inline-block"></span> Expenses</span>
                    <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-sm bg-emerald-500 inline-block"></span> Net Profit</span>
                  </div>
                </div>
                <div class="h-72">
                  <canvas id="monthlyTrendChart"></canvas>
                </div>
              </div>

              <!-- Executive Highlights Sidecard -->
              <div class="p-6 rounded-xl bg-slate-900 border border-slate-800 shadow-sm flex flex-col justify-between">
                <div>
                  <h3 class="text-sm font-semibold text-white mb-1">Executive Highlights</h3>
                  <p class="text-xs text-slate-400 mb-4">Verified by Double-Entry Ledger Engine</p>

                  <div class="space-y-3.5 text-xs">
                    <div class="p-3 rounded-lg bg-slate-800/60 border border-slate-700/60">
                      <div class="font-semibold text-slate-200">Double-Entry Balance Sheet</div>
                      <div class="text-slate-400 mt-0.5">Assets strictly equal Liabilities + Equity across all 12 fiscal months with <strong class="text-emerald-400">$0.00 discrepancy</strong>.</div>
                    </div>

                    <div class="p-3 rounded-lg bg-slate-800/60 border border-slate-700/60">
                      <div class="font-semibold text-slate-200">Budget Discipline</div>
                      <div class="text-slate-400 mt-0.5">Overall actual expenditure (${fmtUSD(bva.total_actual)}) tracked within <strong class="text-brand-400">${fmtPct(bva.variance_pct)}</strong> of approved budget.</div>
                    </div>

                    <div class="p-3 rounded-lg bg-slate-800/60 border border-slate-700/60">
                      <div class="font-semibold text-slate-200">Credit Risk Engine</div>
                      <div class="text-slate-400 mt-0.5">WOE Logistic model achieves <strong class="text-emerald-400">ROC-AUC 0.8469</strong> across 5,000 borrower files, outperforming raw scoring benchmarks.</div>
                    </div>
                  </div>
                </div>

                <div class="pt-4 border-t border-slate-800 flex items-center justify-between text-xs text-slate-400">
                  <span>Ready for Board Review</span>
                  <button onclick="navigateTo('reports')" class="text-brand-400 hover:text-brand-300 font-semibold flex items-center gap-1">
                    Export Board PDF &rarr;
                  </button>
                </div>
              </div>
            </div>
          </div>
        `;
        document.getElementById('contentArea').innerHTML = html;

        // Render Monthly Trend Chart
        renderMonthlyTrendChart(data.monthly_trends);

      } catch (err) {
        document.getElementById('contentArea').innerHTML = `<div class="p-6 text-red-400 bg-red-950/20 rounded-xl border border-red-800">Failed to load overview: ${err.message}</div>`;
      }
    }

    function renderMonthlyTrendChart(trends) {
      const ctx = document.getElementById('monthlyTrendChart').getContext('2d');
      const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
      
      const revData = trends.map(t => t.total_revenue);
      const expData = trends.map(t => t.cogs + t.operating_expenses);
      const netData = trends.map(t => t.net_profit);

      if (chartInstance) chartInstance.destroy();

      chartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: months,
          datasets: [
            {
              label: 'Gross Revenue',
              data: revData,
              backgroundColor: '#0284c7',
              borderRadius: 4,
              order: 2
            },
            {
              label: 'Total Expenses',
              data: expData,
              backgroundColor: '#475569',
              borderRadius: 4,
              order: 3
            },
            {
              label: 'Net Profit',
              data: netData,
              type: 'line',
              borderColor: '#10b981',
              backgroundColor: '#10b981',
              borderWidth: 2.5,
              tension: 0.3,
              pointRadius: 4,
              order: 1
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                label: (ctx) => ` ${ctx.dataset.label}: ${fmtUSD(ctx.raw)}`
              }
            }
          },
          scales: {
            x: { grid: { display: false }, ticks: { color: '#94a3b8' } },
            y: {
              grid: { color: 'rgba(148, 163, 184, 0.1)' },
              ticks: { color: '#94a3b8', callback: (v) => `$${(v/1000000).toFixed(1)}M` }
            }
          }
        }
      });
    }

    // ------------------------------------------------------------------------
    // VIEW 2: FINANCIAL STATEMENTS (P&L and Reconciled Balance Sheet)
    // ------------------------------------------------------------------------
    async function loadFinancialStatements() {
      try {
        const [pnlRes, bsRes] = await Promise.all([
          fetch('/api/financial/profit-loss'),
          fetch('/api/financial/balance-sheet?month=12')
        ]);
        const pnl = await pnlRes.json();
        const bs = await bsRes.json();

        const html = `
          <div class="space-y-6">
            <div class="flex items-center justify-between">
              <div>
                <h1 class="text-2xl font-bold tracking-tight text-white">Financial Statement Analysis</h1>
                <p class="text-xs text-slate-400">GAAP-Compliant Profit & Loss and Reconciled Balance Sheet</p>
              </div>
              <div class="flex items-center gap-2">
                <button onclick="document.getElementById('pnlSection').scrollIntoView({behavior:'smooth'})" class="px-3 py-1.5 text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg border border-slate-700 font-medium">P&L Statement</button>
                <button onclick="document.getElementById('bsSection').scrollIntoView({behavior:'smooth'})" class="px-3 py-1.5 text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg border border-slate-700 font-medium">Balance Sheet</button>
              </div>
            </div>

            <!-- SECTION A: P&L Statement -->
            <div id="pnlSection" class="p-6 rounded-xl bg-slate-900 border border-slate-800 shadow-sm">

        loan_amount: parseFloat(document.getElementById('inpLoanAmt').value) || 10000,
        loan_grade: document.getElementById('inpGrade').value,
        interest_rate: parseFloat(document.getElementById('inpIrate').value) || 12.0,
        debt_to_income_ratio: parseFloat(document.getElementById('inpDTI').value) || 18.0,
        revolving_utilization_pct: parseFloat(document.getElementById('inpUtil').value) || 45.0,
        derogatory_records: parseInt(document.getElementById('inpDerog').value) || 0,
        employment_length_years: parseFloat(document.getElementById('inpEmp').value) || 3.0,
        home_ownership: "MORTGAGE",
        loan_term_months: 36,
        total_credit_accounts: 18,
        open_credit_accounts: 9,
        loan_purpose: "debt_consolidation"
      };

      try {
        const res = await fetch('/api/credit-risk/predict', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const resData = await res.json();
        const pred = resData.prediction;

        const isApproved = pred.decision === 'APPROVED';
        const isReview = pred.decision === 'MANUAL_REVIEW';

        document.getElementById('scorecardResult').innerHTML = `
          <div>
            <div class="flex items-center justify-between pb-2 border-b border-slate-800 mb-4">
              <span class="text-xs font-semibold text-white">Underwriting Decision</span>
              <span class="px-2.5 py-1 rounded text-xs font-bold ${isApproved ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : isReview ? 'bg-amber-500/10 text-amber-400 border border-amber-500/20' : 'bg-red-500/10 text-red-400 border border-red-500/20'}">
                ${pred.decision}
              </span>
            </div>

            <div class="text-center py-4">
              <div class="text-xs text-slate-400 uppercase tracking-wider font-semibold">FinSight Credit Score</div>
              <div class="text-5xl font-black font-mono text-white mt-1">${pred.credit_score}</div>
              <div class="mt-2 inline-block px-3 py-0.5 rounded-full text-xs font-semibold ${isApproved ? 'bg-emerald-500/10 text-emerald-400' : isReview ? 'bg-amber-500/10 text-amber-400' : 'bg-red-500/10 text-red-400'}">
                ${pred.risk_band}
              </div>
            </div>

            <div class="space-y-2.5 text-xs mt-4 pt-4 border-t border-slate-800">
              <div class="flex justify-between">
                <span class="text-slate-400">Default Probability:</span>
                <span class="font-mono font-bold text-slate-200">${pred.predicted_prob_default_pct}%</span>
              </div>
              <div class="flex justify-between">
                <span class="text-slate-400">Model Version:</span>
                <span class="font-mono text-slate-400">${pred.model_version}</span>
              </div>
              <div class="mt-3 p-3 rounded-lg bg-slate-800/60 border border-slate-700/60 text-slate-300">
                <strong>Policy Recommendation:</strong><br>
                ${pred.underwriting_recommendation}
              </div>
            </div>
          </div>
          <div class="text-[10px] text-slate-500 text-center mt-4">
            Analytical evaluation demonstration • Non-regulated underwriting engine
          </div>
        `;
      } catch (err) {
        alert('Prediction error: ' + err.message);
      }
    }
